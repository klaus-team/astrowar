name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: astrowar

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            zip: astrowar-linux-x86_64.zip
            kind: linux
          - name: Windows x86_64
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
            zip: astrowar-windows-x86_64.zip
            kind: windows
          - name: macOS universal
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            zip: astrowar-macos-universal.zip
            kind: macos

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.kind }}

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            zip \
            dpkg-dev \
            rpm \
            libarchive-tools \
            zstd \
            binutils

      - name: Build (Linux / Windows)
        if: matrix.kind != 'macos'
        env:
          ASTROWAR_DEFAULT_SERVER_URL: ${{ secrets.ASTROWAR_DEFAULT_SERVER_URL }}
        run: cargo build --locked --release --package astrowar --target ${{ matrix.targets }}

      - name: Build (macOS universal)
        if: matrix.kind == 'macos'
        env:
          ASTROWAR_DEFAULT_SERVER_URL: ${{ secrets.ASTROWAR_DEFAULT_SERVER_URL }}
        run: |
          cargo build --locked --release --package astrowar --target aarch64-apple-darwin
          cargo build --locked --release --package astrowar --target x86_64-apple-darwin
          lipo -create -output "${{ runner.temp }}/astrowar" \
            target/aarch64-apple-darwin/release/astrowar \
            target/x86_64-apple-darwin/release/astrowar

      - name: Package zip (Linux)
        if: matrix.kind == 'linux'
        run: |
          staging="${{ runner.temp }}/stage"
          mkdir -p "$staging"
          cp "target/${{ matrix.targets }}/release/${{ env.BINARY }}" "$staging/"
          cp LICENSE "$staging/"
          (cd "$staging" && zip -r "${{ github.workspace }}/${{ matrix.zip }}" .)

      - name: Package installers (Linux)
        if: matrix.kind == 'linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/linux/package.sh \
            "$version" \
            "target/${{ matrix.targets }}/release/${{ env.BINARY }}" \
            LICENSE \
            "${{ github.workspace }}"

      - name: Package zip (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.targets }}/release/${{ env.BINARY }}.exe" $staging
          Copy-Item LICENSE $staging
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath "${{ matrix.zip }}" -Force

      - name: Package installer (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $stage = Join-Path $env:GITHUB_WORKSPACE "packaging-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.targets }}/release/${{ env.BINARY }}.exe" $stage
          Copy-Item LICENSE $stage
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$stage" "/DOutputDir=$env:GITHUB_WORKSPACE" "packaging\windows\astrowar.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip (macOS)
        if: matrix.kind == 'macos'
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="${{ runner.temp }}/stage"
          app="$staging/AstroWar.app"
          mkdir -p "$app/Contents/MacOS"
          cp "${{ runner.temp }}/astrowar" "$app/Contents/MacOS/${{ env.BINARY }}"
          plist="$app/Contents/Info.plist"
          /usr/bin/plutil -create xml1 "$plist"
          /usr/bin/plutil -insert CFBundleExecutable -string "${{ env.BINARY }}" "$plist"
          /usr/bin/plutil -insert CFBundleIdentifier -string "com.astrowar.client" "$plist"
          /usr/bin/plutil -insert CFBundleName -string "AstroWar" "$plist"
          /usr/bin/plutil -insert CFBundlePackageType -string "APPL" "$plist"
          /usr/bin/plutil -insert CFBundleShortVersionString -string "$version" "$plist"
          /usr/bin/plutil -insert CFBundleVersion -string "$version" "$plist"
          /usr/bin/plutil -insert LSMinimumSystemVersion -string "11.0" "$plist"
          cp LICENSE "$staging/"
          (cd "$staging" && zip -r "${{ github.workspace }}/${{ matrix.zip }}" .)

      - name: Package installer (macOS)
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          dmg_root="${{ runner.temp }}/dmg"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R "${{ runner.temp }}/stage/AstroWar.app" "$dmg_root/"
          cp LICENSE "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname "AstroWar" -srcfolder "$dmg_root" -ov -format UDZO \
            "${{ github.workspace }}/astrowar-macos-universal.dmg"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          files=(
            astrowar-*.zip
            astrowar_*_amd64.deb
            astrowar-*.rpm
            astrowar-*.pkg.tar.zst
            astrowar-*-setup.exe
            astrowar-*.dmg
          )
          if ((${#files[@]} == 0)); then
            echo "no release assets found" >&2
            exit 1
          fi
          mv "${files[@]}" release-assets/
          ls -l release-assets

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
