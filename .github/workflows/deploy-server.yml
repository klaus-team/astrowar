name: Publish server image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: astrowar-server

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}"
          tag="${GITHUB_REF_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${tag}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          pkg="${{ env.IMAGE_NAME }}"
          if gh api "orgs/${owner}/packages/container/${pkg}" >/dev/null 2>&1; then
            gh api --method PUT \
              "orgs/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public
          elif gh api "users/${owner}/packages/container/${pkg}" >/dev/null 2>&1; then
            gh api --method PUT \
              "users/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public
          else
            echo "Package not visible via API yet; set visibility to public in the GitHub UI if pulls require auth."
          fi
