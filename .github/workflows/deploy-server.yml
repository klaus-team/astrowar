name: Deploy server

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: astrowar-server

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}"
          tag="${GITHUB_REF_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${tag}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          pkg="${{ env.IMAGE_NAME }}"
          if gh api "orgs/${owner}/packages/container/${pkg}" >/dev/null 2>&1; then
            gh api --method PUT \
              "orgs/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public
          elif gh api "users/${owner}/packages/container/${pkg}" >/dev/null 2>&1; then
            gh api --method PUT \
              "users/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public
          else
            echo "Package not visible via API yet; set visibility to public in the GitHub UI if pulls require auth."
          fi

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require deploy secrets
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_PATH; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets incomplete; published image only."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Upload compose file
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: docker/compose.deploy.yaml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull and restart
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: IMAGE,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            if [ -f compose.deploy.yaml ] && [ ! -f compose.yaml ]; then
              mv compose.deploy.yaml compose.yaml
            elif [ -f compose.deploy.yaml ]; then
              mv -f compose.deploy.yaml compose.yaml
            fi
            touch .env
            if grep -q '^ASTROWAR_SERVER_IMAGE=' .env; then
              sed -i.bak "s|^ASTROWAR_SERVER_IMAGE=.*|ASTROWAR_SERVER_IMAGE=${IMAGE}|" .env
              rm -f .env.bak
            else
              echo "ASTROWAR_SERVER_IMAGE=${IMAGE}" >> .env
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
            set -a
            # shellcheck disable=SC1091
            [ -f .env ] && . ./.env
            set +a
            curl -fsS "http://${ASTROWAR_PUBLISH_ADDR:-127.0.0.1}:${ASTROWAR_HOST_PORT:-8080}/health"
